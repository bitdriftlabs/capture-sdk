[workspace]
members = [
  "platform/crash",
  "platform/jvm",
  "platform/jvm/core",
  "platform/shared",
  "platform/swift/source",
  "platform/test_helpers",
  "proto",
  "test/benchmark",
  "test/platform/jvm",
  "test/platform/swift/bridging",
  "test/platform/pom_checker",
  "tools/capture-dev",
]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
android_logger = { version = "0.15.1", default-features = false }
anstyle = "1.0.14"
anyhow = "1.0.104"
assert_matches = "1.5.0"
async-trait = "0.1.92"
bd-api = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-artifact-upload = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-bonjson = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-bonjson-ffi = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-buffer = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-client-common = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-client-stats-store = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-crash-handler = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-device = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-error-reporter = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-grpc = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-hyper-network = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648", default-features = false, features = [
  "ring",
] }
bd-key-value = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-log = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-log-metadata = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-log-primitives = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-logger = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-noop-network = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-proto = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-report-parsers = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-report-writer = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-runtime = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-session = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-session-replay = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-shutdown = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-test-helpers = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648", default-features = false, features = [
  "ring",
] }
bd-test-helpers-core = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
bd-time = { git = "https://github.com/bitdriftlabs/shared-core.git", rev = "ebdd42a4140667ad63b47003214003d402a03648" }
clap = { version = "4.6.6", features = ["derive", "env"] }
crc32fast = "1.5.1"
ctor = "1.0.13"
dialoguer = { version = "0.11.0", default-features = false, features = ["fuzzy-select"] }
env_logger = { version = "0.11.11", default-features = false }
flatbuffers = "=25.9.23" # https://github.com/google/flatbuffers/issues/8876
futures-util = "0.3.34"
gherkin = "0.16"
jni = "0.21.1"
log = { version = "0.4.34", features = ["max_level_trace", "release_max_level_info"] }
memmap2 = "0.9.11"
objc = "0.2.7"
objc-foundation = "0.1.1"
parameterized = "2.1.0"
parking_lot = "0.12.5"
platform-shared = { path = "platform/shared" }
pretty_assertions = "1.4.1"
protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
  "bytes",
  "with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
rand = "0.10.2"
rand_distr = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["serde-well-known", "macros"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
panic         = "abort"
