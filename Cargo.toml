[workspace]
members = [
  "platform/crash",
  "platform/jvm",
  "platform/jvm/core",
  "platform/shared",
  "platform/swift/source",
  "platform/test_helpers",
  "proto",
  "test/benchmark",
  "test/platform/jvm",
  "test/platform/swift/bridging",
  "test/platform/pom_checker",
]
resolver = "3"

[workspace.dependencies]
ahash = "0.8.12"
android_logger = { version = "0.15.1", default-features = false }
anyhow = "1.0.104"
assert_matches = "1.5.0"
async-trait = "0.1.92"
bd-api = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-api" }
bd-bonjson = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-bonjson" }
bd-bonjson-ffi = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-bonjson-ffi" }
bd-buffer = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-buffer" }
bd-client-common = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-client-common" }
bd-client-stats-store = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-client-stats-store" }
bd-crash-handler = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-crash-handler" }
bd-device = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-device" }
bd-error-reporter = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-error-reporter" }
bd-grpc = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-grpc" }
bd-hyper-network = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-hyper-network", default-features = false, features = [
  "ring",
] }
bd-key-value = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-key-value" }
bd-log = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-log" }
bd-log-metadata = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-log-metadata" }
bd-log-primitives = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-log-primitives" }
bd-logger = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-logger" }
bd-noop-network = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-noop-network" }
bd-proto = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-proto" }
bd-report-parsers = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-report-parsers" }
bd-report-writer = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-report-writer" }
bd-runtime = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-runtime" }
bd-session = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-session" }
bd-session-replay = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-session-replay" }
bd-shutdown = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-shutdown" }
bd-test-helpers = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-test-helpers", default-features = false, features = [
  "ring",
] }
bd-test-helpers-core = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-test-helpers-core" }
bd-time = { path = "/Users/mklein/.worktree-env/worktree/monorepo/shared-core/bd-time" }
clap = { version = "4.6.6", features = ["derive", "env"] }
crc32fast = "1.5.1"
ctor = "1.0.13"
env_logger = { version = "0.11.11", default-features = false }
flatbuffers = "=25.9.23" # https://github.com/google/flatbuffers/issues/8876
futures-util = "0.3.34"
jni = "0.21.1"
log = { version = "0.4.34", features = ["max_level_trace", "release_max_level_info"] }
memmap2 = "0.9.11"
objc = "0.2.7"
objc-foundation = "0.1.1"
parameterized = "2.1.0"
parking_lot = "0.12.5"
platform-shared = { path = "platform/shared" }
pretty_assertions = "1.4.1"
protobuf = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack", features = [
  "bytes",
  "with-bytes",
] }
protobuf-codegen = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
protobuf-json-mapping = { git = "https://github.com/bitdriftlabs/rust-protobuf.git", branch = "patch-stack" }
rand = "0.10.2"
rand_distr = "0.6.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["serde-well-known", "macros"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = "s"
panic         = "abort"
