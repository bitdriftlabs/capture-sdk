name: capture_flutter
description: Official Flutter plugin for the Bitdrift Capture SDK. Provides logging, session management, and session replay for Flutter apps.
version: 0.0.3
homepage: https://bitdrift.io
repository: https://github.com/bitdriftlabs/capture-sdk

environment:
  # 3.44.0 / 3.12.0 minimums required for Flutter's Built-in Kotlin support
  # (see android/build.gradle.kts — this plugin no longer applies
  # org.jetbrains.kotlin.android directly).
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.bitdrift.capture_flutter
        pluginClass: CaptureFlutterPlugin
      ios:
        pluginClass: CaptureFlutterPlugin
