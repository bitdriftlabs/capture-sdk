name: linux_test
on:
  push:
    branches:
      - main
  pull_request:
# Cancel in-progress CI jobs when a new commit is pushed to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  linux_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require BuildBuddy Test and Clippy
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash ci/wait_for_buildbuddy_check.sh "$TEST_COMMIT" Test
          bash ci/wait_for_buildbuddy_check.sh "$TEST_COMMIT" Clippy
