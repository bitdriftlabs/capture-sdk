name: Release to GitHub
on:
  workflow_call:
    inputs:
      version:
        description: 'The new version to tag, ex: 0.9.102'
        required: true
        type: string
      platform:
        type: string
        description: Which platform(s) to release (all, android, ios)
        required: false
        default: all
      android-artifacts:
        type: string
        description: Which Android artifacts to publish (all, capture-only)
        required: false
        default: all
      capture-suffix:
        type: string
        description: 'Custom Android capture artifact suffix including separator (e.g. "-no-jank-stats" -> io.bitdrift:capture-no-jank-stats). Ignored if platform is ios. Leave empty for standard "capture".'
        required: false
        default: ''
      include-sdk-verification-file:
        type: boolean
        description: Include Google Play SDK verification file from GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS secret in the Android AAR.
        required: false
        default: true
      include-swift-6-4-xcframework:
        type: boolean
        description: Build the Xcode 27 `.xcframework` in addition to the default Xcode 26 artifact.
        required: false
        default: true
      dry-run:
        type: boolean
        description: Build and validate release artifacts without uploading or creating a GitHub release.
        required: false
        default: false
      release-ref:
        type: string
        description: Branch or tag to build/release from. Defaults to main.
        required: false
        default: main
    secrets:
      OPEN_CAPTURE_SDK_PRS_APP_ID:
        required: true
      OPEN_CAPTURE_SDK_PRS_PRIVATE_KEY:
        required: true
      GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'The new version to tag, ex: 0.9.102'
        required: true
        type: string
      platform:
        type: choice
        description: Which platform(s) to release
        required: true
        default: all
        options:
          - all
          - android
          - ios
      android-artifacts:
        type: choice
        description: Which Android artifacts to publish
        required: true
        default: all
        options:
          - all
          - capture-only
      capture-suffix:
        type: string
        description: 'Custom Android capture artifact suffix including separator (e.g. "-no-jank-stats" -> io.bitdrift:capture-no-jank-stats). Ignored if platform is ios. Leave empty for standard "capture".'
        required: false
        default: ''
      include-sdk-verification-file:
        type: boolean
        description: Include Google Play SDK verification file from GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS secret in the Android AAR.
        required: false
        default: true
      include-swift-6-4-xcframework:
        type: boolean
        description: Build the Xcode 27 `.xcframework` in addition to the default Xcode 26 artifact.
        required: false
        default: true
      dry-run:
        type: boolean
        description: Build and validate release artifacts without uploading or creating a GitHub release.
        required: false
        default: false
      release-ref:
        type: string
        description: Branch or tag to build/release from. Defaults to main.
        required: false
        default: main
jobs:
  verify-version:
    name: Verify arguments
    runs-on: ubuntu-latest
    steps:
      - name: Print & verify entered "version"
        run: |
          echo "$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+(\.[0-9]+)?)?$ ]]; then exit 1; fi
          if [ -n "$CAPTURE_SUFFIX" ] && [ "$PLATFORM" != "android" ]; then
            echo "capture-suffix can only be used with platform=android" >&2
            exit 1
          fi
    env:
      VERSION: ${{ inputs.version }}
      CAPTURE_SUFFIX: ${{ inputs.capture-suffix }}
      PLATFORM: ${{ inputs.platform }}
      INCLUDE_SDK_VERIFICATION_FILE: ${{ inputs.include-sdk-verification-file }}

  # The iOS release build builds the xcframework in release mode and uploads it to the artifact store for later use.
  ios-release-build:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    name: Capture.xcframework with artifacts (${{ matrix.variant }})
    needs: ["verify-version"]
    runs-on: ${{ matrix.variant == 'swift-6.4' && 'xcode-27' || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ inputs.include-swift-6-4-xcframework && fromJSON('["default", "swift-6.4"]') || fromJSON('["default"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.ref_name }}
      - name: Setup
        uses: ./.github/actions/setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          enable-bazel-cache: "false"
          cache-key-scope: release-${{ github.workflow }}
      - name: 'Update the content of platform/shared/.sdk_version'
        run: echo -n "${{ inputs.version }}" > platform/shared/.sdk_version
      - name: Resolve release plan
        id: plan
        run: IOS_RELEASE_DRY_RUN=1 ./tools/ios_release.sh Capture "$VERSION" "$VARIANT" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
      - name: 'Install dependencies'
        run: ./ci/mac_ci_setup.sh "$XCODE_VERSION"
        env:
          XCODE_VERSION: ${{ steps.plan.outputs.xcode_version }}
      - name: Build xcframework + artifacts
        run: |
          ./tools/ios_release.sh Capture "$VERSION" "$VARIANT"
          mv "./dist/$OUTPUT_ZIP" "./$OUTPUT_ZIP"
          unzip -t "./$OUTPUT_ZIP"
          if [ "$BUILD_DOCCARCHIVE" = "true" ]; then
            mv ./dist/Capture.doccarchive.ios.zip ./Capture.doccarchive.ios.zip
            unzip -t ./Capture.doccarchive.ios.zip
          fi
        env:
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
          OUTPUT_ZIP: ${{ steps.plan.outputs.output_zip }}
          BUILD_DOCCARCHIVE: ${{ steps.plan.outputs.build_doccarchive }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry-run }}
        with:
          name: ${{ steps.plan.outputs.output_zip }}
          path: ./${{ steps.plan.outputs.output_zip }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry-run && steps.plan.outputs.build_doccarchive == 'true' }}
        with:
          name: Capture.doccarchive.ios.zip
          path: ./Capture.doccarchive.ios.zip

  build-ios-example-apps:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    needs: ["verify-version"]
    permissions:
      contents: write
    uses: ./.github/workflows/example_apps_ios.yaml
    with:
      release-ref: ${{ inputs.release-ref }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  # The Android release build builds capture.aar and accompanying artifacts, like the .pom xml and the symbols corresponding to the .so.
  android-release-build:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    name: Capture.aar with artifacts
    needs: ["verify-version"]
    runs-on: ubuntu-latest
    steps:
      # Checkout repo to Github Actions runner
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.ref_name }}
      - name: Setup Android SDK
        uses: ./.github/actions/android-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          enable-bazel-cache: "false"
          cache-key-scope: release-${{ github.workflow }}
      - name: 'Update the content of platform/shared/.sdk_version'
        run: echo -n "${{ inputs.version }}" > platform/shared/.sdk_version
      - name: Add Google Play SDK verification file
        if: ${{ inputs.include-sdk-verification-file }}
        env:
          GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS: ${{ secrets.GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS:-}" ]]; then
            echo "GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS secret is required when include-sdk-verification-file is true" >&2
            exit 1
          fi
          verification_dir="platform/jvm/capture/src/main/resources/META-INF/io/bitdrift/capture"
          mkdir -p "$verification_dir"
          printf '%s' "$GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS" > "$verification_dir/verification.properties"
          if ! grep -q '^token=' "$verification_dir/verification.properties"; then
            echo "GOOGLE_PLAY_SDK_VERIFICATION_FILE_CONTENTS must contain the full verification.properties contents, including token=..." >&2
            exit 1
          fi
      - name: Install Clang
        run: sudo apt-get install -y clang
      - name: Build AAR + artifacts
        run: |
          artifact_name="capture$CAPTURE_SUFFIX"
          ./tools/android_release.sh "$VERSION" "$artifact_name" "$INCLUDE_SDK_VERIFICATION_FILE"
        env:
          VERSION: ${{ inputs.version }}
          CAPTURE_SUFFIX: ${{ inputs.capture-suffix }}
          INCLUDE_SDK_VERIFICATION_FILE: ${{ inputs.include-sdk-verification-file }}
      - name: Verify Android release archive
        run: unzip -t ./dist/Capture.android.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry-run }}
        with:
          name: Capture.android.zip
          path: ./dist/Capture.android.zip

  build-android-example-apps:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    needs: ["verify-version"]
    permissions:
      contents: write
    uses: ./.github/workflows/example_apps_android.yaml
    with:
      release-ref: ${{ inputs.release-ref }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  build-android-integrations:
    if: ${{ (inputs.platform == 'all' || inputs.platform == 'android') && inputs.android-artifacts == 'all' }}
    name: Build Android Integrations
    needs: ["verify-version"]
    permissions:
      contents: write
    uses: ./.github/workflows/integrations_android.yaml
    with:
      version: ${{ inputs.version }}
      release-ref: ${{ inputs.release-ref }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  create-release:
    permissions:
      contents: write
    name: GitHub release
    runs-on: ubuntu-latest
    # always() is needed because some dependencies may be conditionally skipped
    # (e.g. iOS jobs when platform=android, integrations when capture-only).
    # Without it, a skipped dependency would also skip this job.
    if: ${{ always() && !failure() && !cancelled() && !inputs.dry-run }}
    needs: [
      "ios-release-build",
      "build-ios-example-apps",
      "android-release-build",
      "build-android-example-apps",
      "build-android-integrations",
    ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.ref_name }}
      # Download all artifacts to current working directory
      - name: Download All artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Prepare Android artifacts
        if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
        run: ./ci/gh_prepare_android_artifacts.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Prepare iOS artifacts
        if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          mv Capture.ios.zip Capture-$VERSION.ios.zip
          mv Capture.doccarchive.ios.zip Capture-$VERSION.doccarchive.ios.zip
          if [ -f Capture-swift-6.4.ios.zip ]; then
            mv Capture-swift-6.4.ios.zip "Capture-swift-6.4-$VERSION.ios.zip"
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: 'Create Github Token'
        if: ${{ (inputs.release-ref || github.ref_name) == 'main' }}
        id: org-pr-create-token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        with:
          app_id: ${{ secrets.OPEN_CAPTURE_SDK_PRS_APP_ID }}
          private_key: ${{ secrets.OPEN_CAPTURE_SDK_PRS_PRIVATE_KEY }}

      - name: 'Commit & push to main only'
        if: ${{ (inputs.release-ref || github.ref_name) == 'main' }}
        env:
          GH_TOKEN: ${{ steps.org-pr-create-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          content=$(echo -n "$VERSION" | base64)
          sha=$(gh api \
            repos/${GITHUB_REPOSITORY}/contents/platform/shared/.sdk_version \
            -q .sha || true)

          gh api \
            --method PUT \
            repos/${GITHUB_REPOSITORY}/contents/platform/shared/.sdk_version \
            -f message="Update SDK version to ${VERSION}" \
            -f content="${content}" \
            -f sha="${sha}" \
            -f branch="main"

        # Use CHANGELOG.md in root
        # Extracts the content between the second and third H2 header (the latest released version)
      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2
        continue-on-error: true
        with:
          release_notes_file: tmp_notes.md

      - name: Check extract release notes
        run: |
          if [ "${{ steps.extract-release-notes.outcome }}" != "success" ]; then
            echo "Extract release notes step failed, will use --generate-notes"
          else
            echo "Extract release notes step succeeded"
          fi

      # Collect release assets based on platform and android-artifacts selection
      - name: Collect release assets
        id: assets
        run: |
          assets=""
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            assets="$assets Capture-$VERSION.ios.zip Capture-$VERSION.doccarchive.ios.zip example-apps.ios.zip"
            if [ -f "Capture-swift-6.4-$VERSION.ios.zip" ]; then
              assets="$assets Capture-swift-6.4-$VERSION.ios.zip"
            fi
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            assets="$assets Capture-$VERSION.android.zip example-apps.android.zip"
            if [ "$ANDROID_ARTIFACTS" = "all" ]; then
              assets="$assets capture-timber-$VERSION.android.zip capture-apollo-$VERSION.android.zip capture-plugin-$VERSION.android.zip capture-plugin-marker-$VERSION.android.zip"
            fi
          fi
          echo "files=$assets" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
          ANDROID_ARTIFACTS: ${{ inputs.android-artifacts }}

        # Upload artifacts to the newly created release.
        # Prefix release version with "v". If capture-suffix is set, append it to the tag.
      - name: Create release
        run: |
          target_ref="${RELEASE_REF:-$GITHUB_REF_NAME}"
          tag="v$VERSION"
          if [ -n "$CAPTURE_SUFFIX" ] && [ "$PLATFORM" = "android" ]; then
            tag="v$VERSION$CAPTURE_SUFFIX"
          fi
          gh release create "$tag" \
            --target "$target_ref" \
            --notes-file tmp_notes.md \
            ${{ steps.assets.outputs.files }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_SUFFIX: ${{ inputs.capture-suffix }}
          PLATFORM: ${{ inputs.platform }}
          RELEASE_REF: ${{ inputs.release-ref }}

  dry-run-complete:
    name: Dry-run complete
    runs-on: ubuntu-latest
    if: ${{ always() && !failure() && !cancelled() && inputs.dry-run }}
    needs: [
      "ios-release-build",
      "build-ios-example-apps",
      "android-release-build",
      "build-android-example-apps",
      "build-android-integrations",
    ]
    steps:
      - name: Summarize validated release artifacts
        run: |
          echo "Release dry run completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "All selected artifacts were built and archive integrity-checked; no artifacts were uploaded and no GitHub release was created." >> "$GITHUB_STEP_SUMMARY"
