name: Android fatal issue reports E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: fatal-issue-reports-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_gradle_test_app:
    name: Build gradle-test-app
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'android-fatal-e2e-test'
    runs-on: ubuntu-latest-8-cores
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    env:
      SKIP_PROTO_GEN: 1
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Setup Android command-line tools
        uses: ./.github/actions/android-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
          setup-gradle-cache: "true"

      - name: Build gradle-test-app debug APK
        timeout-minutes: 45
        run: ./tools/android_sdk_wrapper.sh platform/jvm/gradlew -Prust-target=x86_64 -p platform/jvm gradle-test-app:assembleDebug -x lintDebug -x detekt --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gradle-test-app-debug.apk
          path: platform/jvm/gradle-test-app/build/outputs/apk/debug/gradle-test-app-debug.apk
          if-no-files-found: error

  verify_fatal_issue_reports:
    name: Verify fatal issue reports (API ${{ matrix.api-level }})
    needs: build_gradle_test_app
    runs-on: ${{ matrix.runner || 'ubuntu-latest-8-cores' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    env:
      MAESTRO_VERSION: "2.10.0"
      EMULATOR_BUILD: "15917651"
    strategy:
      fail-fast: false
      matrix:
        api-level: ["30", "31", "32", "33", "34", "35", "36", "37.0"]
        include:
          - api-level: "37.0"
            runner: ubuntu-26.04
            experimental: true
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gradle-test-app-debug.apk
          path: .

      - name: Restore Maestro
        id: maestro-cache
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-cli-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp_dir="$(mktemp -d)"
          gh release download "cli-${MAESTRO_VERSION}" --repo mobile-dev-inc/maestro \
            --pattern maestro.zip --pattern checksums_sha256.txt --dir "$tmp_dir"
          (cd "$tmp_dir" && grep ' maestro.zip$' checksums_sha256.txt | sha256sum --check)
          unzip -q "$tmp_dir/maestro.zip" -d "$tmp_dir"
          mkdir -p ~/.maestro
          cp -R "$tmp_dir"/maestro/* ~/.maestro/

      - name: Add Maestro to PATH
        run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Setup Android emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-build: ${{ env.EMULATOR_BUILD }}
          use-avd-snapshot: ${{ matrix.api-level != '37.0' }}

      - name: Verify ANR, JVM crash and native crash reports
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
        timeout-minutes: 30
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          APK_PATH: gradle-test-app-debug.apk
          LOGS_DIR: fatal-issue-reports-logs
        with:
          force-avd-creation: false
          channel: stable
          emulator-build: ${{ env.EMULATOR_BUILD }}
          api-level: ${{ matrix.api-level }}
          target: google_apis
          ram-size: ${{ matrix.api-level == '37.0' && '4096M' || '2048M' }}
          arch: x86_64
          disk-size: 6144M
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ./ci/verify_fatal_issue_reports.sh

      - name: Record API level for the PR report
        if: ${{ always() }}
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          mkdir -p fatal-issue-reports-logs
          echo "$API_LEVEL" > fatal-issue-reports-logs/api_level.txt

      - name: Upload logcat
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fatal-issue-reports-logs-api-${{ matrix.api-level }}
          path: fatal-issue-reports-logs
          if-no-files-found: ignore

  report_on_pr:
    name: Report results on PR
    needs: verify_fatal_issue_reports
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.label.name == 'android-fatal-e2e-test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fatal-issue-reports-logs-api-*
          path: results

      - name: Post results comment
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const cases = [
              ['anr', 'ANR'],
              ['jvm_crash', 'JVM crash'],
              ['native_crash', 'Native crash'],
            ];
            const experimentalApiLevels = new Set(['37.0']);
            const androidVersions = {
              '30': 'Android 11', '31': 'Android 12', '32': 'Android 12L', '33': 'Android 13',
              '34': 'Android 14', '35': 'Android 15', '36': 'Android 16', '37.0': 'Android 17',
            };

            const readResults = (dir) => {
              const resultsPath = path.join(dir, 'results.txt');
              if (!fs.existsSync(resultsPath)) {
                return null;
              }
              const lines = fs.readFileSync(resultsPath, 'utf8').trim().split('\n').filter(Boolean);
              return lines.length > 0 ? Object.fromEntries(lines.map((line) => line.split('|'))) : null;
            };

            const rows = (fs.existsSync('results') ? fs.readdirSync('results') : [])
              .map((dir) => path.join('results', dir))
              .filter((dir) => fs.existsSync(path.join(dir, 'api_level.txt')))
              .map((dir) => ({
                apiLevel: fs.readFileSync(path.join(dir, 'api_level.txt'), 'utf8').trim(),
                results: readResults(dir),
              }))
              .sort((a, b) => parseFloat(a.apiLevel) - parseFloat(b.apiLevel));

            let passed = 0;
            let total = 0;
            const tableRows = rows.map(({ apiLevel, results }) => {
              const experimental = experimentalApiLevels.has(apiLevel);
              const os = `${androidVersions[apiLevel] ?? 'Android'} (API ${apiLevel})${experimental ? ' · experimental' : ''}`;
              const cells = cases.map(([key]) => {
                if (!experimental) {
                  total += 1;
                }
                if (!results) {
                  return '⏭️';
                }
                if (results[key] === 'pass') {
                  if (!experimental) {
                    passed += 1;
                  }
                  return '✅';
                }
                return '❌';
              });
              return `| ${os} | ${cells.join(' | ')} |`;
            });

            const allPassed = total > 0 && passed === total;
            const marker = '<!-- android-fatal-e2e-report -->';
            const body = [
              marker,
              '## Android Fatal Issue Reports E2E',
              '',
              allPassed
                ? `All fatal issue reports were persisted and processed on the next launch (${passed}/${total} passed).`
                : `Some fatal issue reports were not processed on the next launch (${passed}/${total} passed).`,
              '',
              `| OS | ${cases.map(([, label]) => label).join(' | ')} |`,
              `|---|${cases.map(() => ':---:').join('|')}|`,
              ...tableRows,
              '',
              '- ✅ Report processed on the next launch',
              '- ❌ Report missing',
              '- ⏭️ Not run: the emulator did not start',
              '- Experimental rows are not counted',
              '',
              `Commit ${process.env.HEAD_SHA.substring(0, 7)} · [Run logs and logcat artifacts](${process.env.RUN_URL}) · Re-add the \`android-fatal-e2e-test\` label to run again.`,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Remove label so it can be re-added to run again
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'android-fatal-e2e-test',
            });
