name: Trigger Android Crash Test Loop E2E test

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Total number of random native crash iterations
        required: false
        default: '5000'
        type: string

jobs:
  run_random_native_crashes:
    name: Android gradle-test-app crash loop test
    runs-on: ubuntu-latest-8-cores
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    env:
      CRASH_LOOP_API_KEY: ${{ secrets.CRASH_LOOP_API_KEY }}
      SKIP_PROTO_GEN: 1
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Setup Android command-line tools
        uses: ./.github/actions/android-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
          setup-gradle-cache: "true"
          setup-emulator: 'true'
          emulator-api-level: '31'
          emulator-target: google_apis
          emulator-arch: x86_64

      - name: Build gradle-test-app debug APK
        timeout-minutes: 45
        run: ./tools/android_sdk_wrapper.sh platform/jvm/gradlew -Prust-target=x86_64 -PskipGradleTestAppLintOnAssemble=true -p platform/jvm gradle-test-app:assembleDebug --stacktrace

      - name: Run random native crashes
        timeout-minutes: 360
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
        with:
          avd-name: android-gradle-test-app-crash-loop-test
          channel: stable
          force-avd-creation: false
          api-level: 31
          target: google_apis
          ram-size: 2048M
          arch: x86_64
          disk-size: 6144M
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash ./ci/run_gradle_test_app_random_native_crashes.sh "${{ github.event.inputs.iterations }}"
