name: React Native Update Version
on:
  workflow_call:
    inputs:
      version:
        description: The native Capture SDK version, for example 0.51.0
        required: true
        type: string
    secrets:
      OPEN_CAPTURE_SDK_PRS_APP_ID:
        required: true
      OPEN_CAPTURE_SDK_PRS_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The native Capture SDK version, for example 0.51.0
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: platform/es

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup JavaScript
        uses: ./.github/actions/javascript-setup
        with:
          cache-key-scope: release-${{ github.workflow }}

      - name: Calculate React Native version from Capture SDK
        env:
          CAPTURE_SDK_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const parse = (version) => {
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error(`Expected a stable major.minor.patch version: ${version}`);
            }
            return version.split('.').map(Number);
          };
          const sdkVersion = process.env.CAPTURE_SDK_VERSION;
          const [major, minor, patch] = parse(sdkVersion);
          const currentVersion = require('./packages/react-native/package.json').version;
          const published = JSON.parse(execFileSync('npm', [
            'view', '@bitdrift/react-native', 'versions', '--json', '--prefer-online'
          ], { encoding: 'utf8' }));
          let highestPatch = -1;
          for (const version of [currentVersion, ...published.filter(v => !v.includes('-') && !v.includes('+'))]) {
            const [rnMajor, rnMinor, rnPatch] = parse(version);
            if (rnMajor > major || (rnMajor === major && rnMinor > minor)) {
              throw new Error(`React Native ${version} is ahead of Capture SDK ${sdkVersion} in major/minor. Resolve manually.`);
            }
            if (rnMajor === major && rnMinor === minor) {
              highestPatch = Math.max(highestPatch, rnPatch);
            }
          }
          const version = `${major}.${minor}.${Math.max(patch, highestPatch + 1)}`;
          fs.writeFileSync('.auto-release-react-version', `${version}\n`);
          console.log(`Capture SDK ${sdkVersion} -> React Native ${version}`);
          NODE

      - name: Update the React Native native dependency pins
        env:
          CAPTURE_SDK_VERSION: ${{ inputs.version }}
        run: ./scripts/update_rn_capture_version.sh "$CAPTURE_SDK_VERSION"

      # Use the existing release app so the resulting PR triggers SDK checks.
      - name: Create release app token
        id: release-app
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0
        with:
          app_id: ${{ secrets.OPEN_CAPTURE_SDK_PRS_APP_ID }}
          private_key: ${{ secrets.OPEN_CAPTURE_SDK_PRS_PRIVATE_KEY }}

      - name: Create pull request with Capture SDK version bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.release-app.outputs.token }}
          title: Update Capture SDK version to ${{ inputs.version }}
          commit-message: Update Capture SDK version to ${{ inputs.version }}
          base: main
          delete-branch: true
          branch: update-react-native-capture-sdk-${{ inputs.version }}
          add-paths: platform/es
          body: |
            Updates the React Native integration to Capture SDK ${{ inputs.version }}.

            https://github.com/bitdriftlabs/capture-sdk/releases/tag/v${{ inputs.version }}
