name: ios
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_invocation_id:
        description: Successful BuildBuddy iOS release artifacts invocation for this commit
        required: true
        type: string
# Cancel in-progress CI jobs when a new commit is pushed to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  pre_check:
    name: pre_check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    outputs:
      should_run: ${{ github.event_name == 'push' || steps.check_changes.outputs.run_tests }}
      has_affected_clippy_targets: ${{ steps.bazel_check.outputs.has_affected_clippy_targets }}
      workflow_changed: ${{ steps.workflow_check.outputs.changed }}
      clippy_config_changed: ${{ steps.clippy_config_check.outputs.changed }}
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}

      - name: Check for Bazel build file changes
        id: bazel_check
        run: |
          ./ci/check_bazel.sh //examples/swift:ios_app //platform/swift //test/platform/swift
        env:
          BAZEL_DIFF_CLIPPY_TARGETS_QUERY: 'attr("tags", "clippy_macos", //...)'
      - name: Check for workflow file changes
        id: workflow_check
        uses: ./.github/actions/files-changed
        with:
          files: |
            .github/workflows/ios.yaml
            buildbuddy.yaml
            ci/buildbuddy_api.sh
            ci/download_buildbuddy_artifacts.sh
            ci/run_buildbuddy_workflow.sh
            ci/stage_bazel_artifacts.py
            ci/verify_ios_simulator_ipa.sh
            ci/ios_ci_simulator.sh
            ci/ios_app_size_report.sh
            ci/parse_ios_app_thinning_report.py
            ci/capture_ios_binary_size.sh
            ci/check_ios_xcframework_archive_members.sh
            ci/extract_embedded_profile_plist.py
      - name: Check for Clippy configuration changes
        id: clippy_config_check
        uses: ./.github/actions/check-clippy-config
      - name: Upload affected Clippy targets
        if: ${{ steps.bazel_check.outputs.has_affected_clippy_targets == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-affected-clippy-targets
          path: /tmp/impacted_clippy_targets.txt
          if-no-files-found: error
      - name: Determine if tests should run
        id: check_changes_separate
        run: |
          bazel_changed="${{ steps.bazel_check.outputs.changed }}"
          workflow_changed="${{ steps.workflow_check.outputs.changed }}"
          clippy_config_changed="${{ steps.clippy_config_check.outputs.changed }}"

          if [[ "$bazel_changed" == "true" || "$workflow_changed" == "true" || "$clippy_config_changed" == "true" ]]; then
            echo "Changes detected in one or more checks. Running tests."
            echo "run_tests=true" >> $GITHUB_ENV
          else
            echo "No relevant changes found."
            echo "run_tests=false" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run downstream tests if changes are detected
        id: check_changes
        if: env.run_tests == 'true'
        run: ./ci/run_tests.sh
  ios_release_artifacts:
    name: iOS release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: pre_check
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.pre_check.result == 'success' && needs.pre_check.outputs.should_run == 'true' &&
        (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)))
    outputs:
      invocation_id: ${{ steps.artifacts.outputs.invocation_id }}
      commit: ${{ steps.artifacts.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build iOS artifacts after Test
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXISTING_INVOCATION_ID: ${{ inputs.artifact_invocation_id }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          invocation="$EXISTING_INVOCATION_ID"
          if [[ -z "$invocation" ]]; then
            bash ci/wait_for_buildbuddy_check.sh "$commit" Test
            invocation="$(./ci/run_buildbuddy_workflow.sh 'iOS release artifacts' "$SOURCE_BRANCH" "$commit")"
          fi
          if [[ ! "$invocation" =~ ^[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}$ ]]; then
            echo "Invalid BuildBuddy invocation ID." >&2
            exit 1
          fi
          echo "invocation_id=$invocation" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  swift_hello_world:
    name: swift_hello_world
    timeout-minutes: 25
    needs: ios_release_artifacts
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ios_release_artifacts.outputs.commit }}

      - name: Install dependencies
        run: ./ci/mac_ci_setup.sh

      - name: Download and launch the simulator app
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_RW_API_KEY }}
          ARTIFACT_INVOCATION_ID: ${{ needs.ios_release_artifacts.outputs.invocation_id }}
          ARTIFACT_COMMIT: ${{ needs.ios_release_artifacts.outputs.commit }}
        run: |
          set -euo pipefail
          ./ci/download_buildbuddy_artifacts.sh "$ARTIFACT_INVOCATION_ID" "$ARTIFACT_COMMIT" "$RUNNER_TEMP" \
            ios_hello_world_simulator.ipa
          ./ci/verify_ios_simulator_ipa.sh "$RUNNER_TEMP/ios_hello_world_simulator.ipa"

  clippy:
    name: iOS Clippy
    runs-on: macos-26
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    needs: "pre_check"
    if: >-
      needs.pre_check.result == 'success' &&
      (github.event_name == 'push' ||
      needs.pre_check.outputs.has_affected_clippy_targets == 'true' ||
      needs.pre_check.outputs.workflow_changed == 'true' ||
      needs.pre_check.outputs.clippy_config_changed == 'true')
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}

      - name: "Install dependencies"
        run: ./ci/mac_ci_setup.sh

      - name: Download affected Clippy targets
        if: ${{ github.event_name == 'pull_request' && needs.pre_check.outputs.has_affected_clippy_targets == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-affected-clippy-targets
          path: /tmp

      - name: Run Clippy
        uses: ./.github/actions/run-clippy
        with:
          slice: macos_runner
          mode: ${{ (github.event_name == 'push' || needs.pre_check.outputs.workflow_changed == 'true' || needs.pre_check.outputs.clippy_config_changed == 'true') && 'full' || 'affected' }}
          affected-targets-path: /tmp/impacted_clippy_targets.txt
  ios_size_comparison:
    name: iOS size comparison
    timeout-minutes: 40
    needs: ios_release_artifacts
    runs-on: macos-26
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    outputs:
      ios_app_size_kb: ${{ steps.ios_size.outputs.current_kb }}
      capture_binary_size_kb: ${{ steps.capture_binary_size.outputs.current_kb }}
      capture_archive_breakdown: ${{ steps.capture_archive_breakdown.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ios_release_artifacts.outputs.commit }}

      - name: Install dependencies
        run: ./ci/mac_ci_setup.sh

      - name: Download iOS release artifacts
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_RW_API_KEY }}
          ARTIFACT_INVOCATION_ID: ${{ needs.ios_release_artifacts.outputs.invocation_id }}
          ARTIFACT_COMMIT: ${{ needs.ios_release_artifacts.outputs.commit }}
        run: |
          ./ci/download_buildbuddy_artifacts.sh "$ARTIFACT_INVOCATION_ID" "$ARTIFACT_COMMIT" "$RUNNER_TEMP" \
            Capture.ios.zip ios_app_size.ipa

      - name: Install signing assets
        env:
          IOS_SIZE_CERT_P12_BASE64: ${{ secrets.IOS_SIZE_CERT_P12_BASE64 }}
          IOS_SIZE_CERT_PASSWORD: ${{ secrets.IOS_SIZE_CERT_PASSWORD }}
          IOS_SIZE_PROFILE_BASE64: ${{ secrets.IOS_SIZE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Import signing material into a throwaway keychain instead of the shared login keychain.
          # This keeps the GitHub-hosted runner isolated to the cert/profile required for this job.
          SIGNING_TEMP_DIR="$RUNNER_TEMP/ios-size-signing"
          CERT_PATH="$SIGNING_TEMP_DIR/ios_size_cert.p12"
          PROFILE_PATH="$SIGNING_TEMP_DIR/ios_size_profile.mobileprovision"
          KEYCHAIN_PATH="$SIGNING_TEMP_DIR/ios-size.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          XCODE_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          LEGACY_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$SIGNING_TEMP_DIR"
          echo "$IOS_SIZE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_SIZE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_SIZE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Xcode 16+ uses the UserData location, but some tooling still consults the legacy directory.
          # So, we copy the provisioning profile to both directories to prevent issues
          mkdir -p "$XCODE_PROFILE_DIR" "$LEGACY_PROFILE_DIR"
          cp "$PROFILE_PATH" "$XCODE_PROFILE_DIR/"
          cp "$PROFILE_PATH" "$LEGACY_PROFILE_DIR/"

      - name: Export and measure thinned iOS app size
        id: ios_size
        run: |
          set -euo pipefail
          export IOS_APP_SIZE_UNSIGNED_IPA="$RUNNER_TEMP/ios_app_size.ipa"
          export IOS_APP_SIZE_PROFILE_PATH="$RUNNER_TEMP/ios-size-signing/ios_size_profile.mobileprovision"
          export IOS_APP_SIZE_KEYCHAIN_PATH="$RUNNER_TEMP/ios-size-signing/ios-size.keychain-db"
          ./ci/ios_app_size_report.sh | tee ios_app_size_output.log
          IOS_APP_SIZE_KB=$(grep '^IOS_APP_SIZE_KB=' ios_app_size_output.log | cut -d'=' -f2 || true)
          if [ -z "$IOS_APP_SIZE_KB" ]; then
            echo "Failed to parse IOS_APP_SIZE_KB from size script output."
            exit 1
          fi
          echo "current_kb=$IOS_APP_SIZE_KB" >> "$GITHUB_OUTPUT"

      - name: Materialize Capture SDK XCFramework
        run: |
          set -euo pipefail
          rm -rf ios_capture_size
          mkdir -p ios_capture_size
          unzip -q "$RUNNER_TEMP/Capture.ios.zip" -d ios_capture_size

      - name: Measure Capture SDK binary size
        id: capture_binary_size
        env:
          IOS_CAPTURE_BINARY_PATH: ios_capture_size/Capture.xcframework/ios-arm64/Capture.framework/Capture
        run: |
          set -euo pipefail
          ./ci/capture_ios_binary_size.sh | tee ios_capture_binary_size_output.log
          IOS_CAPTURE_BINARY_SIZE_KB=$(grep '^IOS_CAPTURE_BINARY_SIZE_KB=' ios_capture_binary_size_output.log | cut -d'=' -f2 || true)
          if [ -z "$IOS_CAPTURE_BINARY_SIZE_KB" ]; then
            echo "Failed to parse IOS_CAPTURE_BINARY_SIZE_KB from binary size script output."
            exit 1
          fi
          echo "current_kb=$IOS_CAPTURE_BINARY_SIZE_KB" >> "$GITHUB_OUTPUT"

      - name: Snapshot Capture SDK archive composition
        id: capture_archive_breakdown
        env:
          IOS_CAPTURE_BINARY_PATH: ios_capture_size/Capture.xcframework/ios-arm64/Capture.framework/Capture
        run: |
          set -euo pipefail
          ./ci/capture_ios_archive_breakdown.py "$IOS_CAPTURE_BINARY_PATH" > ios_capture_archive_breakdown.json
          echo "json=$(cat ios_capture_archive_breakdown.json)" >> "$GITHUB_OUTPUT"

      - name: Upload iOS size artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_app_size
          path: |
            ios_app_size_output/export/*.ipa
            ios_app_size_output/export/App Thinning Size Report.txt
            ${{ runner.temp }}/Capture.ios.zip
            ios_capture_binary_size_output.log

      - name: Remove signing assets
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail

          SIGNING_TEMP_DIR="$RUNNER_TEMP/ios-size-signing"
          XCODE_PROFILE_PATH="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/ios_size_profile.mobileprovision"
          LEGACY_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/ios_size_profile.mobileprovision"

          security delete-keychain "$SIGNING_TEMP_DIR/ios-size.keychain-db" || true
          rm -f "$XCODE_PROFILE_PATH" "$LEGACY_PROFILE_PATH" || true
          rm -rf "$SIGNING_TEMP_DIR" || true

  ios_size_baseline:
    name: iOS size baseline
    runs-on: ubuntu-latest
    needs: ["pre_check", "ios_size_comparison"]
    if: needs.pre_check.outputs.should_run == 'true' && needs.ios_size_comparison.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save iOS size baseline (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_APP_SIZE_KB: ${{ needs.ios_size_comparison.outputs.ios_app_size_kb }}
          IOS_CAPTURE_BINARY_SIZE_KB: ${{ needs.ios_size_comparison.outputs.capture_binary_size_kb }}
          IOS_CAPTURE_ARCHIVE_BREAKDOWN: ${{ needs.ios_size_comparison.outputs.capture_archive_breakdown }}
        run: |
          set -euo pipefail
          BASELINE_FILE=ci/baseline_ios_app_size_kb.txt
          CAPTURE_BINARY_BASELINE_FILE=ci/baseline_ios_capture_binary_size_kb.txt
          CAPTURE_ARCHIVE_BREAKDOWN_BASELINE_FILE=ci/baseline_ios_capture_archive_breakdown.json
          echo "$IOS_APP_SIZE_KB" > "$BASELINE_FILE"
          echo "$IOS_CAPTURE_BINARY_SIZE_KB" > "$CAPTURE_BINARY_BASELINE_FILE"
          echo "$IOS_CAPTURE_ARCHIVE_BREAKDOWN" > "$CAPTURE_ARCHIVE_BREAKDOWN_BASELINE_FILE"

          # main updates a dedicated ci-baseline branch that stores the latest accepted iOS size
          # snapshot. PRs read from that branch so they can compare against main without rebuilding it.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch origin ci-baseline
          git worktree add temp-worktree origin/ci-baseline

          cp "$BASELINE_FILE" temp-worktree/ci/
          cp "$CAPTURE_BINARY_BASELINE_FILE" temp-worktree/ci/
          cp "$CAPTURE_ARCHIVE_BREAKDOWN_BASELINE_FILE" temp-worktree/ci/

          cd temp-worktree
          git add ci/baseline_ios_app_size_kb.txt ci/baseline_ios_capture_binary_size_kb.txt ci/baseline_ios_capture_archive_breakdown.json

          if ! git diff --cached --quiet; then
            git commit -m "ci: update iOS size baselines [skip ci]"
            git push origin HEAD:ci-baseline
          else
            echo "No changes to iOS size baselines."
          fi

          cd ..
          git worktree remove temp-worktree --force

      - name: Fetch iOS size baseline (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail

          # PRs pull the last baseline file from the ci-baseline branch instead of recomputing main's
          # size in-line. That keeps the comparison stable and makes the PR report just a diff vs main.
          git fetch origin ci-baseline || true
          if git worktree add temp-baseline origin/ci-baseline; then
            if [ -f temp-baseline/ci/baseline_ios_app_size_kb.txt ]; then
              cp temp-baseline/ci/baseline_ios_app_size_kb.txt ci/
            fi
            if [ -f temp-baseline/ci/baseline_ios_capture_binary_size_kb.txt ]; then
              cp temp-baseline/ci/baseline_ios_capture_binary_size_kb.txt ci/
            fi
            if [ -f temp-baseline/ci/baseline_ios_capture_archive_breakdown.json ]; then
              cp temp-baseline/ci/baseline_ios_capture_archive_breakdown.json ci/
            fi
            git worktree remove temp-baseline --force
          else
            echo "No ci-baseline branch found."
          fi

      - name: Compare iOS app size
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: ios_size_compare
        env:
          IOS_APP_SIZE_KB: ${{ needs.ios_size_comparison.outputs.ios_app_size_kb }}
        run: |
          set -euo pipefail
          BASELINE_PATH=ci/baseline_ios_app_size_kb.txt
          CURRENT_KB="$IOS_APP_SIZE_KB"
          echo "current_kb=$CURRENT_KB" >> "$GITHUB_OUTPUT"

          if [ ! -f "$BASELINE_PATH" ]; then
            echo "baseline_kb=" >> "$GITHUB_OUTPUT"
            echo "diff_kb=" >> "$GITHUB_OUTPUT"
          else
            BASELINE_KB=$(cat "$BASELINE_PATH")
            DIFF_KB=$((CURRENT_KB - BASELINE_KB))
            echo "baseline_kb=$BASELINE_KB" >> "$GITHUB_OUTPUT"
            echo "diff_kb=$DIFF_KB" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare Capture SDK binary size
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: capture_binary_size_compare
        env:
          IOS_CAPTURE_BINARY_SIZE_KB: ${{ needs.ios_size_comparison.outputs.capture_binary_size_kb }}
        run: |
          set -euo pipefail
          BASELINE_PATH=ci/baseline_ios_capture_binary_size_kb.txt
          CURRENT_KB="$IOS_CAPTURE_BINARY_SIZE_KB"
          echo "current_kb=$CURRENT_KB" >> "$GITHUB_OUTPUT"

          if [ ! -f "$BASELINE_PATH" ]; then
            echo "baseline_kb=" >> "$GITHUB_OUTPUT"
            echo "diff_kb=" >> "$GITHUB_OUTPUT"
          else
            BASELINE_KB=$(cat "$BASELINE_PATH")
            DIFF_KB=$((CURRENT_KB - BASELINE_KB))
            echo "baseline_kb=$BASELINE_KB" >> "$GITHUB_OUTPUT"
            echo "diff_kb=$DIFF_KB" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare Capture SDK archive composition
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: capture_archive_breakdown_compare
        env:
          IOS_CAPTURE_ARCHIVE_BREAKDOWN: ${{ needs.ios_size_comparison.outputs.capture_archive_breakdown }}
        run: |
          set -euo pipefail
          CURRENT_PATH=ios_capture_archive_breakdown.json
          BASELINE_PATH=ci/baseline_ios_capture_archive_breakdown.json
          REPORT_PATH=ios_capture_archive_breakdown_report.md
          echo "$IOS_CAPTURE_ARCHIVE_BREAKDOWN" > "$CURRENT_PATH"

          if [ -n "$IOS_CAPTURE_ARCHIVE_BREAKDOWN" ] && [ -f "$BASELINE_PATH" ]; then
            ./ci/compare_ios_archive_breakdown.py "$BASELINE_PATH" "$CURRENT_PATH" > "$REPORT_PATH"
          else
            : > "$REPORT_PATH"
          fi

          {
            echo "markdown<<EOF"
            cat "$REPORT_PATH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report iOS app size on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v6
        env:
          IOS_CURRENT_KB: ${{ steps.ios_size_compare.outputs.current_kb }}
          IOS_BASELINE_KB: ${{ steps.ios_size_compare.outputs.baseline_kb }}
          IOS_DIFF_KB: ${{ steps.ios_size_compare.outputs.diff_kb }}
          IOS_CAPTURE_BINARY_CURRENT_KB: ${{ steps.capture_binary_size_compare.outputs.current_kb }}
          IOS_CAPTURE_BINARY_BASELINE_KB: ${{ steps.capture_binary_size_compare.outputs.baseline_kb }}
          IOS_CAPTURE_BINARY_DIFF_KB: ${{ steps.capture_binary_size_compare.outputs.diff_kb }}
          IOS_CAPTURE_ARCHIVE_BREAKDOWN: ${{ steps.capture_archive_breakdown_compare.outputs.markdown }}
        with:
          script: |
            const marker = '<!-- ios-size-comparison -->';
            const appCurrent = process.env.IOS_CURRENT_KB;
            const appBaseline = process.env.IOS_BASELINE_KB;
            const appDiff = process.env.IOS_DIFF_KB;
            const captureCurrent = process.env.IOS_CAPTURE_BINARY_CURRENT_KB;
            const captureBaseline = process.env.IOS_CAPTURE_BINARY_BASELINE_KB;
            const captureDiff = process.env.IOS_CAPTURE_BINARY_DIFF_KB;
            const captureArchiveBreakdown = process.env.IOS_CAPTURE_ARCHIVE_BREAKDOWN;

            let body = `${marker}
            ## iOS Size Comparison Report

            | Metric | Thinned App Size (KB) | Capture SDK Binary (KB) |
            |--------|------------------------|-------------------------|`;

            if ((appBaseline && appBaseline !== '') || (captureBaseline && captureBaseline !== '')) {
              body += `
            | Baseline | ${appBaseline || 'N/A'} | ${captureBaseline || 'N/A'} |
            | Current | ${appCurrent} | ${captureCurrent} |
            | Difference | ${appDiff || 'N/A'} | ${captureDiff || 'N/A'} |`;

              if (appBaseline && appBaseline !== '') {
                const appDiffNumber = parseInt(appDiff, 10);
                if (appDiffNumber > 0) {
                  body += `\n\n> Thinned app size increased by ${appDiffNumber} KB.`;
                } else if (appDiffNumber < 0) {
                  body += `\n\n> Thinned app size decreased by ${Math.abs(appDiffNumber)} KB.`;
                } else {
                  body += '\n\n> Thinned app size unchanged.';
                }
              }

              if (captureBaseline && captureBaseline !== '') {
                const captureDiffNumber = parseInt(captureDiff, 10);
                if (captureDiffNumber > 0) {
                  body += `\n> Capture SDK binary size increased by ${captureDiffNumber} KB.`;
                } else if (captureDiffNumber < 0) {
                  body += `\n> Capture SDK binary size decreased by ${Math.abs(captureDiffNumber)} KB.`;
                } else {
                  body += '\n> Capture SDK binary size unchanged.';
                }

                if (captureDiffNumber > 0 && captureArchiveBreakdown) {
                  body += `\n\n${captureArchiveBreakdown}`;
                }
              }
            } else {
              body += `
            | Current | ${appCurrent} | ${captureCurrent} |`;
              body += '\n\nNo iOS size baselines are available for comparison.';
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const foundComment = comments.data.find((comment) =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            const comment = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            };

            if (foundComment?.id) {
              await github.rest.issues.updateComment({
                ...comment,
                comment_id: foundComment.id,
              });
            } else {
              await github.rest.issues.createComment(comment);
            }
  verify_ios:
    runs-on: ubuntu-latest
    needs:
      [
        "pre_check",
        "clippy",
        "swift_hello_world",
        "ios_release_artifacts",
        "ios_size_comparison",
        "ios_size_baseline",
      ]
    if: always() && github.event_name != 'workflow_dispatch'
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          ./ci/check_result.sh ${{ needs.pre_check.result }} \
          && ./ci/check_result.sh ${{ needs.clippy.result }} \
          && ./ci/check_result.sh ${{ needs.swift_hello_world.result }} \
          && ./ci/check_result.sh ${{ needs.ios_release_artifacts.result }} \
          && ./ci/check_result.sh ${{ needs.ios_size_comparison.result }} \
          && ./ci/check_result.sh ${{ needs.ios_size_baseline.result }}
      - name: Require BuildBuddy Test
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ci/wait_for_buildbuddy_check.sh "$TEST_COMMIT"
