name: crash_reporter
on:
  push:
    branches:
      - main
  pull_request:
# Cancel in-progress CI jobs when a new commit is pushed to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  pre_check:
    name: pre_check
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_changes.outputs.run_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure BuildBuddy cache
        uses: ./.github/actions/configure-buildbuddy-cache
        with:
          api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Check for crash reporter changes
        id: crash_check
        uses: ./.github/actions/files-changed
        with:
          regex: '^(platform/crash/|Cargo\.toml$|Cargo\.lock$|Cargo\.Bazel\.lock$|MODULE\.bazel$|MODULE\.bazel\.lock$|\.cargo/|\.github/workflows/crash_reporter\.yaml$)'

      - name: Determine if tests should run
        id: check_changes
        run: |
          crash_changed="${{ steps.crash_check.outputs.changed }}"

          echo "crash_changed: $crash_changed"

          if [[ "$crash_changed" == "true" ]]; then
            echo "Changes detected in crash reporter files. Running tests."
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant crash reporter changes found."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  rust_tests:
    name: rust tests
    needs: "pre_check"
    if: needs.pre_check.outputs.should_run == 'true'
    runs-on: macos-26
    env:
      SKIP_PROTO_GEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          RUST_VERSION="$(sed -n 's/^RUST_VERSION = "\(.*\)"/\1/p' MODULE.bazel)"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.7.8

      - name: Run crash reporter tests
        run: cargo nextest run -p bd-crash-reporter

      - name: Run crash reporter clippy
        run: cargo clippy -p bd-crash-reporter --tests --quiet
