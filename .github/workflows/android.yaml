name: android
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_invocation_id:
        description: Successful BuildBuddy Android release artifacts invocation for this commit
        required: true
        type: string
# Cancel in-progress CI jobs when a new commit is pushed to a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  pre_check:
    name: pre_check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    outputs:
      should_run: ${{ steps.check_changes.outputs.run_tests }}
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}

      # Check for Bazel build file changes
      - name: Check for Bazel build file changes
        id: bazel_check
        run: ./ci/check_bazel.sh //examples/android:android_app

      - name: Check for workflow file changes
        id: workflow_check
        uses: ./.github/actions/files-changed
        with:
          regex: '^(\.bazelrc|MODULE\.bazel(\.lock)?|\.github/(workflows/android\.yaml|actions/(setup|android-setup)/.*)|tools/(android_sdk_wrapper|setup_android_sdk|android_toolchain_versions|check_android_toolchain_versions)\.sh)$'

      - name: Check for relevant Gradle changes
        id: gradle_check
        uses: ./.github/actions/files-changed
        with:
          regex: '^(platform/jvm/(capture-plugin/.*|gradle-test-app/.*\.(gradle|kts|kt|xml))|platform/jvm/capture/src/test/.*)$'

      - name: Check for Cargo.toml changes
        id: cargo_check
        uses: ./.github/actions/files-changed
        with:
          files: Cargo.toml

      - name: Determine if tests should run
        id: check_changes_separate
        run: |
          bazel_changed="${{ steps.bazel_check.outputs.changed }}"
          workflow_changed="${{ steps.workflow_check.outputs.changed }}"
          gradle_changed="${{ steps.gradle_check.outputs.changed }}"
          cargo_changed="${{ steps.cargo_check.outputs.changed }}"

          if [[ "$bazel_changed" == "true" || "$workflow_changed" == "true" || "$gradle_changed" == "true" || "$cargo_changed" == "true" ]]; then
            echo "Changes detected in one or more checks. Running tests."
            echo "run_tests=true" >> $GITHUB_ENV
          else
            echo "No relevant changes found."
            echo "run_tests=false" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Run downstream tests if changes are detected
        id: check_changes
        if: env.run_tests == 'true'
        run: ./ci/run_tests.sh

  build_and_compare_sizes:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.pre_check.result == 'success' && needs.pre_check.outputs.should_run == 'true'))
    needs: pre_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/android-setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}

      - name: Download Android size artifacts
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_RW_API_KEY }}
          ARTIFACT_INVOCATION_ID: ${{ inputs.artifact_invocation_id }}
        run: |
          ./ci/download_buildbuddy_artifacts.sh "$ARTIFACT_INVOCATION_ID" "$GITHUB_SHA" android-release-artifacts \
            android_app.apk capture_aar_so_size_arm64_v8a_kb.txt capture_aar_so_size_x86_64_kb.txt

      - name: Build Bazel multi-ABI APK and AAR size targets
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 30
        run: |
          # Package both the emulator ABI and the production ABI in one build.
          # The size targets extract each library from the resulting AAR.
          ./bazelw build --config ci --config release-android --config linux-hermetic-llvm --remote_download_toplevel --android_platforms=@rules_android//:arm64-v8a,@rules_android//:x86_64 //examples/android:android_app :capture_aar_so_size_arm64_v8a :capture_aar_so_size_x86_64
          mkdir -p android-release-artifacts
          cp bazel-bin/examples/android/android_app.apk bazel-bin/capture_aar_so_size_*_kb.txt android-release-artifacts/

      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: android_app.apk
          path: android-release-artifacts/android_app.apk

      - name: Report downloaded artifact sizes
        if: github.event_name == 'workflow_dispatch'
        working-directory: android-release-artifacts
        run: |
          {
            printf 'Example APK (bytes) | ARM64 native library (KB) | x86-64 native library (KB)\n'
            printf '%s\n' '--- | --- | ---'
            printf '%s | %s | %s\n' "$(stat -c%s android_app.apk)" \
              "$(cat capture_aar_so_size_arm64_v8a_kb.txt)" "$(cat capture_aar_so_size_x86_64_kb.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save size baselines and push to branch (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get APK size
          APK_PATH=android-release-artifacts/android_app.apk
          APK_SIZE_FILE=ci/baseline_binary_size_arm64_v8a_x86_64.txt
          stat -c%s "$APK_PATH" > "$APK_SIZE_FILE"

          # Get the Bazel-generated compressed SO sizes for each packaged ABI.
          ARM64_SO_SIZE_KB=$(cat android-release-artifacts/capture_aar_so_size_arm64_v8a_kb.txt)
          ARM64_SO_SIZE_FILE=ci/baseline_so_size_arm64_v8a_kb.txt
          echo "$ARM64_SO_SIZE_KB" > "$ARM64_SO_SIZE_FILE"
          X86_64_SO_SIZE_KB=$(cat android-release-artifacts/capture_aar_so_size_x86_64_kb.txt)
          X86_64_SO_SIZE_FILE=ci/baseline_so_size_x86_64_kb.txt
          echo "$X86_64_SO_SIZE_KB" > "$X86_64_SO_SIZE_FILE"

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch origin ci-baseline
          git worktree add temp-worktree origin/ci-baseline

          cp "$APK_SIZE_FILE" temp-worktree/ci/
          cp "$ARM64_SO_SIZE_FILE" temp-worktree/ci/
          cp "$X86_64_SO_SIZE_FILE" temp-worktree/ci/

          cd temp-worktree
          git add ci/baseline_binary_size_arm64_v8a_x86_64.txt ci/baseline_so_size_arm64_v8a_kb.txt ci/baseline_so_size_x86_64_kb.txt

          if ! git diff --cached --quiet; then
            git commit -m "ci: update APK and AAR SO size baselines [skip ci]"
            git push origin HEAD:ci-baseline
          else
            echo "No changes to baseline sizes."
          fi

          cd ..
          git worktree remove temp-worktree --force

      - name: Fetch size baselines from branch (PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin ci-baseline
          git worktree add temp-baseline origin/ci-baseline
          if [ -f temp-baseline/ci/baseline_binary_size_arm64_v8a_x86_64.txt ]; then
            cp temp-baseline/ci/baseline_binary_size_arm64_v8a_x86_64.txt ci/
          fi
          if [ -f temp-baseline/ci/baseline_so_size_arm64_v8a_kb.txt ]; then
            cp temp-baseline/ci/baseline_so_size_arm64_v8a_kb.txt ci/
          fi
          if [ -f temp-baseline/ci/baseline_so_size_x86_64_kb.txt ]; then
            cp temp-baseline/ci/baseline_so_size_x86_64_kb.txt ci/
          fi
          git worktree remove temp-baseline --force

      - name: Compute and compare APK size
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: apk_size
        run: |
          APK_PATH=android-release-artifacts/android_app.apk
          BASELINE_PATH=ci/baseline_binary_size_arm64_v8a_x86_64.txt

          if [ ! -f "$APK_PATH" ]; then
            echo "Current APK file not found!"
            exit 1
          fi

          CURRENT_SIZE=$(stat -c%s "$APK_PATH")
          CURRENT_KB=$((CURRENT_SIZE / 1024))
          echo "current_kb=$CURRENT_KB" >> $GITHUB_OUTPUT

          if [ ! -f "$BASELINE_PATH" ]; then
            echo "baseline_kb=" >> $GITHUB_OUTPUT
            echo "diff_kb=" >> $GITHUB_OUTPUT
          else
            BASELINE_SIZE=$(cat "$BASELINE_PATH")
            BASELINE_KB=$((BASELINE_SIZE / 1024))
            DIFF_KB=$((CURRENT_KB - BASELINE_KB))
            echo "baseline_kb=$BASELINE_KB" >> $GITHUB_OUTPUT
            echo "diff_kb=$DIFF_KB" >> $GITHUB_OUTPUT
          fi

      - name: Compute and compare ARM64 AAR SO size
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: arm64_so_size
        run: |
          SO_SIZE_KB=$(cat android-release-artifacts/capture_aar_so_size_arm64_v8a_kb.txt)
          BASELINE_PATH=ci/baseline_so_size_arm64_v8a_kb.txt

          if [ -z "$SO_SIZE_KB" ]; then
            echo "Current SO size not found!"
            exit 1
          fi

          echo "current_kb=$SO_SIZE_KB" >> $GITHUB_OUTPUT

          if [ ! -f "$BASELINE_PATH" ]; then
            echo "baseline_kb=" >> $GITHUB_OUTPUT
            echo "diff_kb=" >> $GITHUB_OUTPUT
          else
            BASELINE_KB=$(cat "$BASELINE_PATH")
            DIFF_KB=$((SO_SIZE_KB - BASELINE_KB))
            echo "baseline_kb=$BASELINE_KB" >> $GITHUB_OUTPUT
            echo "diff_kb=$DIFF_KB" >> $GITHUB_OUTPUT
          fi

      - name: Compute and compare x86_64 AAR SO size
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: x86_64_so_size
        run: |
          SO_SIZE_KB=$(cat android-release-artifacts/capture_aar_so_size_x86_64_kb.txt)
          BASELINE_PATH=ci/baseline_so_size_x86_64_kb.txt

          if [ -z "$SO_SIZE_KB" ]; then
            echo "Current x86_64 SO size not found!"
            exit 1
          fi

          echo "current_kb=$SO_SIZE_KB" >> $GITHUB_OUTPUT

          if [ ! -f "$BASELINE_PATH" ]; then
            echo "baseline_kb=" >> $GITHUB_OUTPUT
            echo "diff_kb=" >> $GITHUB_OUTPUT
          else
            BASELINE_KB=$(cat "$BASELINE_PATH")
            DIFF_KB=$((SO_SIZE_KB - BASELINE_KB))
            echo "baseline_kb=$BASELINE_KB" >> $GITHUB_OUTPUT
            echo "diff_kb=$DIFF_KB" >> $GITHUB_OUTPUT
          fi

      - name: Report sizes on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v6
        env:
          APK_CURRENT_KB: ${{ steps.apk_size.outputs.current_kb }}
          APK_BASELINE_KB: ${{ steps.apk_size.outputs.baseline_kb }}
          APK_DIFF_KB: ${{ steps.apk_size.outputs.diff_kb }}
          ARM64_SO_CURRENT_KB: ${{ steps.arm64_so_size.outputs.current_kb }}
          ARM64_SO_BASELINE_KB: ${{ steps.arm64_so_size.outputs.baseline_kb }}
          ARM64_SO_DIFF_KB: ${{ steps.arm64_so_size.outputs.diff_kb }}
          X86_64_SO_CURRENT_KB: ${{ steps.x86_64_so_size.outputs.current_kb }}
          X86_64_SO_BASELINE_KB: ${{ steps.x86_64_so_size.outputs.baseline_kb }}
          X86_64_SO_DIFF_KB: ${{ steps.x86_64_so_size.outputs.diff_kb }}
        with:
          script: |
            const apkCurrent = process.env.APK_CURRENT_KB;
            const apkBaseline = process.env.APK_BASELINE_KB;
            const apkDiff = process.env.APK_DIFF_KB;
            const arm64SoCurrent = process.env.ARM64_SO_CURRENT_KB;
            const arm64SoBaseline = process.env.ARM64_SO_BASELINE_KB;
            const arm64SoDiff = process.env.ARM64_SO_DIFF_KB;
            const x86_64SoCurrent = process.env.X86_64_SO_CURRENT_KB;
            const x86_64SoBaseline = process.env.X86_64_SO_BASELINE_KB;
            const x86_64SoDiff = process.env.X86_64_SO_DIFF_KB;

            const marker = '<!-- android-size-report-comment -->';
            let body = `${marker}\n## Android Size Comparison Report (arm64-v8a + x86_64)\n\n`;

            if ((apkBaseline && apkBaseline !== '') || (arm64SoBaseline && arm64SoBaseline !== '') || (x86_64SoBaseline && x86_64SoBaseline !== '')) {
              body += `
              | Metric     | APK multi-ABI (KB) | SO arm64-v8a (KB) | SO x86_64 (KB) |
              |------------|--------------------|-------------------|-----------------|
              | Baseline   | ${apkBaseline || 'N/A'} | ${arm64SoBaseline || 'N/A'} | ${x86_64SoBaseline || 'N/A'} |
              | Current    | ${apkCurrent} | ${arm64SoCurrent} | ${x86_64SoCurrent} |
              | Difference | ${apkDiff || 'N/A'} | ${arm64SoDiff || 'N/A'} | ${x86_64SoDiff || 'N/A'} |
              `;

              if (apkBaseline && apkBaseline !== '') {
                if (parseInt(apkDiff, 10) > 0) {
                  body += `\n> APK size increased by ${apkDiff} KB.`;
                } else if (parseInt(apkDiff, 10) < 0) {
                  body += `\n> APK size decreased by ${Math.abs(apkDiff)} KB.`;
                } else {
                  body += `\n> APK size unchanged.`;
                }
              }

              for (const [abi, baseline, diff] of [
                ['arm64-v8a', arm64SoBaseline, arm64SoDiff],
                ['x86_64', x86_64SoBaseline, x86_64SoDiff],
              ]) {
                if (baseline && baseline !== '') {
                  if (parseInt(diff, 10) > 0) {
                    body += `\n> ${abi} SO size increased by ${diff} KB.`;
                  } else if (parseInt(diff, 10) < 0) {
                    body += `\n> ${abi} SO size decreased by ${Math.abs(diff)} KB.`;
                  } else {
                    body += `\n> ${abi} SO size unchanged.`;
                  }
                }
              }
            } else {
              body += `Current sizes: multi-ABI APK ${apkCurrent} KB, arm64-v8a SO ${arm64SoCurrent} KB, x86_64 SO ${x86_64SoCurrent} KB (No baselines available for comparison).`;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const foundComment = comments.find((comment) =>
              comment.user.login === 'github-actions[bot]' &&
              (comment.body.includes(marker) || comment.body.startsWith('## Android Size Comparison Report')),
            );
            const comment = {
              issue_number: context.payload.pull_request.number,
              comment_id: foundComment?.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            };
            if (foundComment?.id) {
              await github.rest.issues.updateComment(comment);
            } else {
              await github.rest.issues.createComment(comment);
            }

  gradle_tests:
    # Requires a "larger runner", for nested virtualization support
    runs-on: ubuntu-latest-8-cores
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    env:
      SKIP_PROTO_GEN: 1
    if: needs.pre_check.outputs.should_run == 'true'
    needs: pre_check
    steps:

    - name: Checkout project sources
      uses: actions/checkout@v4

    - name: Setup Android emulator
      uses: ./.github/actions/setup-android-emulator
      with:
        buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
        api-level: '23'
        target: default
        arch: x86_64
    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Gradle capture-timber unit tests
      working-directory: ./platform/jvm
      run: ./gradlew capture-timber:testReleaseUnitTest --build-cache --info
    - name: Gradle capture-plugin unit tests
      working-directory: ./platform/jvm
      run: ./gradlew capture-plugin:test --build-cache --info
    - name: Check Licenses for modules
      working-directory: ./platform/jvm
      run: ./gradlew replay:checkLicense common:checkLicense capture:checkLicense
    - name: Instrumentation Tests
      uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
      with:
        channel: stable
        force-avd-creation: false
        api-level: 23
        target: default
        ram-size: 2048M
        arch: x86_64
        disk-size: 6144M
        profile: Nexus 6
        disable-animations: true
        emulator-options: -no-snapshot-save -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        # Keep the aggregate task names so the app's Crashlytics setup stays consistent in CI.
        script: >-
          cd platform/jvm && adb uninstall io.bitdrift.gradletestapp.test;
          adb uninstall io.bitdrift.gradletestapp;
          cd ../.. && ./tools/android_sdk_wrapper.sh platform/jvm/gradlew -Prust-target=x86_64 -p platform/jvm
          gradle-test-app:check gradle-test-app:connectedCheck --build-cache --stacktrace
          -x gradle-test-app:testReleaseUnitTest -x gradle-test-app:testProfileableUnitTest

  run_android_benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest-8-cores
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          enable-bazel-cache: "false"
          api-level: '31'
          target: default
          arch: x86_64

      - name: Download the benchmark APK
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_RW_API_KEY }}
          ARTIFACT_INVOCATION_ID: ${{ inputs.artifact_invocation_id }}
        run: |
          ./ci/download_buildbuddy_artifacts.sh "$ARTIFACT_INVOCATION_ID" "$GITHUB_SHA" android-release-artifacts \
            microbenchmark_test_apk.apk

      - name: Run Microbenchmarks
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
        timeout-minutes: 30
        with:
          channel: stable
          force-avd-creation: false
          api-level: 31
          target: default
          ram-size: 2048M
          arch: x86_64
          disk-size: 6144M
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./ci/run_android_benchmarks.sh android-release-artifacts/microbenchmark_test_apk.apk benchmark-output

      - name: Upload benchmark results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output/

  verify_android_hello_world_per_version:
    needs: build_and_compare_sizes
    runs-on: ubuntu-latest-8-cores
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'main-cache' || '' }}
      deployment: false
    strategy:
      matrix:
        api-level: [23, 35]
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: android_app.apk
          path: .
      - name: Setup Android emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_RW_API_KEY || secrets.BUILDBUDDY_API_KEY }}
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
      - name: run tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
        timeout-minutes: 15
        with:
          force-avd-creation: false
          channel: stable
          api-level: ${{ matrix.api-level }}
          target: google_apis
          ram-size: 2048M
          arch: x86_64
          disk-size: 6144M
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./ci/verify_android.sh
      - name: Cache hint on hello world failure
        if: ${{ failure() }}
        run: |
          echo "Android hello world verification failed. Emulator diagnostics are available as a workflow artifact."
      - name: Upload emulator diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics-api-${{ matrix.api-level }}
          path: |
            ~/.android/avd/**/*.ini
            ~/.android/avd/**/*.log
            /tmp/android-runner/**
          if-no-files-found: warn

  # This is a noop job that completes once all the jobs spawned by the previous step completes. By blocking PR merges on this
  # job completing, we are able to gate it on all the previous jobs without explicitly enumerating them.
  verify_android:
    runs-on: ubuntu-latest
    needs: ["pre_check", "build_and_compare_sizes", "verify_android_hello_world_per_version", "gradle_tests"]
    if: always() && github.event_name != 'workflow_dispatch'
    steps:
    # Checkout repo to Github Actions runner
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: check result
      run: ./ci/check_result.sh ${{ needs.pre_check.result }} && ./ci/check_result.sh ${{ needs.build_and_compare_sizes.result }} && ./ci/check_result.sh ${{ needs.verify_android_hello_world_per_version.result }} && ./ci/check_result.sh ${{ needs.gradle_tests.result }}
    - name: Require BuildBuddy Test
      env:
        GH_TOKEN: ${{ github.token }}
        TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: bash ci/wait_for_buildbuddy_check.sh "$TEST_COMMIT"
