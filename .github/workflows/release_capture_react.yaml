name: Trigger React Native Release
on:
  workflow_call:
    inputs:
      version:
        description: 'The SDK version to release to React, ex: 0.18.6'
        required: true
        type: string
      dry-run:
        description: Do not trigger the downstream release.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'The SDK version to release to React, ex: 0.18.6'
        required: true
        type: string
      dry-run:
        description: Do not trigger the downstream release.
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify included shared-core config version
        uses: ./.github/actions/verify-release-version
        with:
          version: ${{ inputs.version }}
          ref: refs/tags/v${{ inputs.version }}

  update-react-native:
    if: ${{ !inputs.dry-run }}
    needs: verify
    uses: ./.github/workflows/react-native-update-capture-sdk-version.yaml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
