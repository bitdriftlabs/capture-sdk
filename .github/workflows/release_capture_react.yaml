name: Trigger capture-es (React Native) Release
on:
  workflow_call:
    inputs:
      version:
        description: 'The SDK version to release to React, ex: 0.18.6'
        required: true
        type: string
      dry-run:
        description: Do not trigger the downstream release.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'The SDK version to release to React, ex: 0.18.6'
        required: true
        type: string
      dry-run:
        description: Do not trigger the downstream release.
        required: false
        type: boolean
        default: false
jobs:
  release-capture-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify included shared-core config version
        uses: ./.github/actions/verify-release-version
        with:
          version: ${{ inputs.version }}
          ref: refs/tags/v${{ inputs.version }}
      - name: org-read-write-install token
        if: ${{ !inputs.dry-run }}
        id: org-read-write
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0
        with:
          app_id: ${{ secrets.OPEN_CAPTURE_SDK_PRS_APP_ID }}
          private_key: ${{ secrets.OPEN_CAPTURE_SDK_PRS_PRIVATE_KEY }}
      - name: Trigger CI Job in capture-ios Repo
        if: ${{ !inputs.dry-run }}
        run: |
          gh workflow run "$WORKFLOW_ID" \
          --repo bitdriftlabs/capture-es \
          --raw-field version=${{ inputs.version }}
        env:
          GH_TOKEN: ${{ steps.org-read-write.outputs.token }}
          # "React Native Update Version" workflow id in the capture-es repo.
          WORKFLOW_ID: 184625065
