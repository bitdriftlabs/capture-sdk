name: Build iOS example apps
on:
  workflow_dispatch:
    inputs:
      release-ref:
        type: string
        description: Branch or tag to build from. Defaults to main.
        required: false
        default: main
      dry-run:
        type: boolean
        description: Build and validate the archive without uploading it.
        required: false
        default: false
  workflow_call:
    inputs:
      release-ref:
        type: string
        description: Branch or tag to build from. Defaults to main.
        required: false
        default: main
      dry-run:
        type: boolean
        description: Build and validate the archive without uploading it.
        required: false
        default: false

jobs:
  build:
    name: Build & upload
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      # Checkout repo to Github Actions runner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install dependencies
        run: ./ci/mac_ci_setup.sh
      - name: Build iOS example apps
        run: ./ci/prepare_example_apps_ios.sh
      - name: Verify iOS example apps archive
        run: unzip -t dist/example-apps.ios.zip
      - name: Upload iOS example apps to GH
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v4
        with:
          name: iOS Example Apps
          path: dist/example-apps.ios.zip
          if-no-files-found: error
