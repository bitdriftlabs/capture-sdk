name: Android setup
description: Sets up Android emulator prerequisites required by Android tests

inputs:
  buildbuddy-api-key:
    description: BuildBuddy API key.
    required: false
  enable-bazel-cache:
    description: Whether to configure the BuildBuddy remote cache.
    required: false
    default: "true"
  cache-key-scope:
    description: Namespace for GitHub Actions caches. Use a release-only value for release builds.
    required: false
    default: ci
  setup-local-android-sdk:
    description: Whether to set up the local Android SDK cache needed by Gradle
    required: false
    default: "false"
  setup-gradle-cache:
    description: Whether to restore Gradle's dependency cache
    required: false
    default: "false"
  java-version:
    description: JDK version to install
    required: false
    default: "17"
  setup-emulator:
    description: Whether to set up emulator prerequisites (KVM, licenses)
    required: false
    default: "false"
  emulator-api-level:
    description: API level of the emulator system image to restore or install
    required: false
    default: ""
  emulator-target:
    description: System image target, such as default or google_apis
    required: false
    default: ""
  emulator-arch:
    description: System image CPU architecture
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Bazel and optional local Android SDK
      uses: ./.github/actions/setup
      with:
        buildbuddy-api-key: ${{ inputs.buildbuddy-api-key }}
        enable-bazel-cache: ${{ inputs.enable-bazel-cache }}
        cache-key-scope: ${{ inputs.cache-key-scope }}
        setup-local-android-sdk: ${{ inputs.setup-local-android-sdk == 'true' || inputs.setup-emulator == 'true' || inputs.emulator-api-level != '' }}

    - name: Enable KVM group perms
      if: inputs.setup-emulator == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up JDK
      if: inputs.setup-emulator == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.setup-gradle-cache == 'true' && 'gradle' || '' }}

    - name: Accept Android SDK licenses
      if: inputs.setup-emulator == 'true'
      shell: bash
      run: |
        # shellcheck source=tools/android_toolchain_versions.sh
        source "$GITHUB_WORKSPACE/tools/android_toolchain_versions.sh"
        yes | "$ANDROID_HOME/cmdline-tools/$android_cmdline_tools_version/bin/sdkmanager" --licenses || true

    - name: Restore Android emulator tools cache
      if: inputs.emulator-api-level != ''
      id: emulator-tools-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ${{ env.ANDROID_HOME }}/emulator
        key: ${{ inputs.cache-key-scope }}-${{ runner.os }}-${{ runner.arch }}-android-emulator-tools-v1

    - name: Install Android emulator tools
      if: inputs.emulator-api-level != '' && steps.emulator-tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: sdkmanager --install "build-tools;36.0.0" emulator

    - name: Save Android emulator tools cache
      if: github.ref == 'refs/heads/main' && inputs.emulator-api-level != '' && steps.emulator-tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          ${{ env.ANDROID_HOME }}/emulator
        key: ${{ inputs.cache-key-scope }}-${{ runner.os }}-${{ runner.arch }}-android-emulator-tools-v1

    - name: Restore Android emulator system image cache
      if: inputs.emulator-api-level != ''
      id: emulator-image-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/platforms/android-${{ inputs.emulator-api-level }}
          ${{ env.ANDROID_HOME }}/system-images/android-${{ inputs.emulator-api-level }}/${{ inputs.emulator-target }}/${{ inputs.emulator-arch }}
        key: ${{ inputs.cache-key-scope }}-${{ runner.os }}-${{ runner.arch }}-android-emulator-api-${{ inputs.emulator-api-level }}-${{ inputs.emulator-target }}-${{ inputs.emulator-arch }}-v1

    - name: Install Android emulator system image
      if: inputs.emulator-api-level != '' && steps.emulator-image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sdkmanager --install \
          "platforms;android-${{ inputs.emulator-api-level }}" \
          "system-images;android-${{ inputs.emulator-api-level }};${{ inputs.emulator-target }};${{ inputs.emulator-arch }}"

    - name: Save Android emulator system image cache
      if: github.ref == 'refs/heads/main' && inputs.emulator-api-level != '' && steps.emulator-image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.ANDROID_HOME }}/platforms/android-${{ inputs.emulator-api-level }}
          ${{ env.ANDROID_HOME }}/system-images/android-${{ inputs.emulator-api-level }}/${{ inputs.emulator-target }}/${{ inputs.emulator-arch }}
        key: ${{ inputs.cache-key-scope }}-${{ runner.os }}-${{ runner.arch }}-android-emulator-api-${{ inputs.emulator-api-level }}-${{ inputs.emulator-target }}-${{ inputs.emulator-arch }}-v1

    - name: Touch local.properties
      shell: bash
      run: touch platform/jvm/local.properties
