name: Configure BuildBuddy cache
description: >-
  Configure Bazel to use authenticated BuildBuddy remote execution on Linux runners, or the
  BuildBuddy remote cache on macOS runners.

inputs:
  api-key:
    description: BuildBuddy API key.
    required: false
  enabled:
    description: Whether to configure BuildBuddy remote execution or the remote cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Write BuildBuddy configuration
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        rm -f .buildrc.bb
        if [[ "${{ inputs.enabled }}" != "true" ]]; then
          echo "BuildBuddy cache disabled by workflow policy."
          exit 0
        fi

        if [[ -z "$BUILDBUDDY_API_KEY" ]]; then
          echo "BuildBuddy cache disabled: API key unavailable."
          exit 0
        fi

        if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          remote_upload_option="build --remote_upload_local_results"
        else
          remote_upload_option="build --noremote_upload_local_results"
        fi

        umask 077
        {
          echo "build --bes_backend=grpcs://remote.buildbuddy.io"
          echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
          # GitHub Actions already reports the job status.
          echo "build --build_metadata=DISABLE_COMMIT_STATUS_REPORTING=true"
          echo "build --remote_cache=grpcs://remote.buildbuddy.io"
          echo "$remote_upload_option"
          echo "build --remote_cache_compression"
          echo "startup --experimental_remote_repo_contents_cache"
          printf "build --remote_header=x-buildbuddy-api-key=%s\\n" "$BUILDBUDDY_API_KEY"
          # Linux runners build and test on BuildBuddy's amd64 executors. macOS runners keep the
          # remote cache only, because Apple targets need macOS executors that --config=rbe lacks.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "build --config=rbe"
          fi
        } > .buildrc.bb
