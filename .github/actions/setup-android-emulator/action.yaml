name: Setup Android emulator
description: Restores or creates an Android emulator snapshot and saves it from main

inputs:
  buildbuddy-api-key:
    description: BuildBuddy API key.
    required: false
  setup-gradle-cache:
    description: Whether to restore Gradle's dependency cache
    required: false
    default: "false"
  api-level:
    description: Android API level for the emulator.
    required: true
  target:
    description: Android system-image target.
    required: true
  arch:
    description: Android system-image architecture.
    required: true
  ram-size:
    description: Emulator RAM size.
    required: false
    default: 2048M
  disk-size:
    description: Emulator disk size.
    required: false
    default: 6144M
  profile:
    description: Emulator hardware profile.
    required: false
    default: Nexus 6
  disable-animations:
    description: Whether to disable Android animations.
    required: false
    default: "true"
  emulator-options:
    description: Options passed to the emulator while creating the snapshot.
    required: false
    default: -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

runs:
  using: composite
  steps:
    - name: Set up Android SDK
      uses: ./.github/actions/android-setup
      with:
        buildbuddy-api-key: ${{ inputs.buildbuddy-api-key }}
        setup-gradle-cache: ${{ inputs.setup-gradle-cache }}
        setup-emulator: "true"
        emulator-api-level: ${{ inputs.api-level }}
        emulator-target: ${{ inputs.target }}
        emulator-arch: ${{ inputs.arch }}

    - name: Determine AVD cache key
      id: avd-cache-key
      shell: bash
      env:
        API_LEVEL: ${{ inputs.api-level }}
        TARGET: ${{ inputs.target }}
        ARCH: ${{ inputs.arch }}
        PROFILE: ${{ inputs.profile }}
        RAM_SIZE: ${{ inputs.ram-size }}
        DISK_SIZE: ${{ inputs.disk-size }}
        DISABLE_ANIMATIONS: ${{ inputs.disable-animations }}
      run: |
        # Bump snapshot-v1 when changing snapshot creation, its defaults, or
        # compatible SDK/emulator versions. The remaining fields describe the
        # AVD configuration and prevent incompatible snapshots from sharing a
        # cache entry.
        cache_key="${RUNNER_OS}-${RUNNER_ARCH}-avd-snapshot-v1-api${API_LEVEL}-${TARGET}-${ARCH}-${PROFILE}-ram${RAM_SIZE}-disk${DISK_SIZE}-animations${DISABLE_ANIMATIONS}"
        cache_key="${cache_key// /-}"
        echo "key=${cache_key}" >> "$GITHUB_OUTPUT"

    - name: Restore AVD cache
      id: avd-cache
      # API 23 snapshots can resume while the image is still completing its boot work. Leave
      # creation to the job's emulator runner so every API 23 run starts from a fresh AVD.
      if: inputs.api-level != '23'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: ${{ steps.avd-cache-key.outputs.key }}

    - name: Kill ADB server to ensure cached keys are used
      shell: bash
      run: adb kill-server || true

    - name: Create AVD and generate snapshot for caching
      if: inputs.api-level != '23' && steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # pin@v2.37.0
      with:
        channel: stable
        force-avd-creation: false
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        ram-size: ${{ inputs.ram-size }}
        arch: ${{ inputs.arch }}
        disk-size: ${{ inputs.disk-size }}
        profile: ${{ inputs.profile }}
        disable-animations: ${{ inputs.disable-animations }}
        emulator-options: ${{ inputs.emulator-options }}
        script: echo "Generated AVD snapshot for caching."

    - name: Save AVD cache
      if: github.ref == 'refs/heads/main' && inputs.api-level != '23' && steps.avd-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: ${{ steps.avd-cache-key.outputs.key }}
