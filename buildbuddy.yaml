# BuildBuddy Workflows. The Linux runner drives Bazel and the execution platforms
# in //bazel/platforms route build and test actions to Linux and macOS executors.
#
# Steps call `bazel` rather than ./bazelw because BuildBuddy adds its cache and results flags to
# `bazel` invocations; the bazel on the runner is Bazelisk, so it still honors .bazelversion.

actions:
  - name: Test
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    container_image: ubuntu-24.04
    steps:
      - run: >-
          bazel test
          --config=workflows
          --config=mixed-rbe
          --keep_going
          --lockfile_mode=error
          --test_output=errors
          --test_env=RUST_LOG=debug
          -- //... //platform/shared:platform-shared_release_backtrace_test

  # Clippy changes the analysis flags and builds production rust_library targets.
  - name: Clippy
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    container_image: ubuntu-24.04
    steps:
      - run: >-
          bazel build
          --config=workflows
          --config=rbe
          --config=libunwind
          --config=clippy
          --lockfile_mode=error
          --build_tag_filters=clippy,-macos_only
          -- //... //platform/shared:build_script_

  # Run manually after Test so release flags and Mac actions have their own run.
  - name: iOS release artifacts
    triggers: {}
    container_image: ubuntu-24.04
    steps:
      - run: |
          set -euo pipefail
          events="$(mktemp)"
          trap 'rm -f "$events"' EXIT
          bazel build \
            --config=workflows \
            --config=release-ios \
            --config=apple-device-rbe \
            --define=ios_produce_framework_plist=true \
            --build_event_json_file="$events" \
            --build_event_json_file_path_conversion=false \
            --lockfile_mode=error \
            -- //:ios_dist //:check_ios_release_xcframework \
            //examples/swift/hello_world:ios_app_size_unsigned.ipa \
            //examples/swift/hello_world:ios_app_simulator_artifact \
            //test/platform/swift/benchmark:ios_benchmark_runner_artifact
          # The Apple transition puts the IPA outside the bazel-bin symlink.
          python3 ci/stage_bazel_artifacts.py "$events" "$BUILDBUDDY_ARTIFACTS_DIRECTORY" \
            Capture.ios.zip ios_app_size_unsigned.ipa=ios_app_size.ipa \
            ios_app.ipa=ios_hello_world_simulator.ipa benchmark_runner.tar.gz

  - name: Android release artifacts
    triggers: {}
    container_image: ubuntu-24.04
    steps:
      - run: |
          set -euo pipefail
          events="$(mktemp)"
          trap 'rm -f "$events"' EXIT
          bazel build \
            --config=workflows \
            --config=rbe \
            --config=release-android \
            --android_platforms=@rules_android//:arm64-v8a,@rules_android//:x86_64 \
            --remote_download_outputs=toplevel \
            --build_event_json_file="$events" \
            --build_event_json_file_path_conversion=false \
            --lockfile_mode=error \
            -- //examples/android:android_app //:capture_aar_so_size_arm64_v8a \
            //:capture_aar_so_size_x86_64 //platform/jvm/microbenchmark:microbenchmark_test_apk
          python3 ci/stage_bazel_artifacts.py "$events" "$BUILDBUDDY_ARTIFACTS_DIRECTORY" \
            android_app.apk capture_aar_so_size_arm64_v8a_kb.txt \
            capture_aar_so_size_x86_64_kb.txt microbenchmark_test_apk.apk
